name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Annulla build vecchie sullo stesso branch quando ne arriva una nuova
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # serve al job `release` per creare/aggiornare la GitHub Release

jobs:
  # ----------------------------------------------------------------------- #
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-ita
      - name: Sync version (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/set_version.sh "${GITHUB_REF_NAME#v}"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Run tests
        run: PYTHONPATH=src pytest -q tests/

  # ----------------------------------------------------------------------- #
  desktop:
    name: Desktop (${{ matrix.os }})
    needs: python-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - os: macos-14
            triple: aarch64-apple-darwin
          - os: macos-13
            triple: x86_64-apple-darwin
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Sync version (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/set_version.sh "${GITHUB_REF_NAME#v}"

      - name: Tauri deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev \
            libayatana-appindicator3-dev libgtk-3-dev \
            pkg-config build-essential file

      - name: Build sidecar (PyInstaller)
        env:
          TARGET_TRIPLE: ${{ matrix.triple }}
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
          bash scripts/build_sidecar.sh

      - name: npm install (Tauri CLI)
        working-directory: desktop
        run: npm install

      - name: Build Tauri bundle
        working-directory: desktop
        run: npx tauri build

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp -v desktop/src-tauri/target/release/bundle/appimage/*.AppImage artifacts/ 2>/dev/null || true
            cp -v desktop/src-tauri/target/release/bundle/deb/*.deb       artifacts/ 2>/dev/null || true
            cp -v desktop/src-tauri/target/release/bundle/rpm/*.rpm       artifacts/ 2>/dev/null || true
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp -v desktop/src-tauri/target/release/bundle/dmg/*.dmg artifacts/ 2>/dev/null || true
          else
            cp -v desktop/src-tauri/target/release/bundle/msi/*.msi   artifacts/ 2>/dev/null || true
            cp -v desktop/src-tauri/target/release/bundle/nsis/*.exe  artifacts/ 2>/dev/null || true
          fi
          ls -la artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: dewarp-desktop-${{ matrix.triple }}
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 30

  # ----------------------------------------------------------------------- #
  android:
    name: Android APK
    needs: python-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3

      - name: Sync version (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ${{ github.workspace }}
        run: bash scripts/set_version.sh "${GITHUB_REF_NAME#v}"

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename APK with version
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [[ ! "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)+${GITHUB_SHA::7}"
          fi
          mkdir -p ../artifacts
          for apk in app/build/outputs/apk/release/*.apk; do
            cp -v "$apk" "../artifacts/dewarp-${VER}.apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dewarp-android-apk
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 30

  # ----------------------------------------------------------------------- #
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: dewarp-*
          merge-multiple: true

      - name: List collected files
        run: ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
          fail_on_unmatched_files: false

  # ----------------------------------------------------------------------- #
  release-nightly:
    # Pubblica/aggiorna una pre-release pubblica "rolling" su ogni push di
    # branch (non tag). Comodo per scaricare l'APK direttamente dal browser
    # del tablet, senza login GitHub. Il tag e' costruito dal nome del branch
    # sanitizzato, cosi' ogni branch ha la sua release indipendente che si
    # sovrascrive a ogni push.
    name: Nightly Release
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: dewarp-*
          merge-multiple: true

      - name: Compute tag name
        id: tag
        run: |
          # Sanitizza il branch name a un tag valido: solo a-z0-9-_
          BR=$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr -c 'a-zA-Z0-9-_\n' '-')
          echo "tag=nightly-${BR}" >> "$GITHUB_OUTPUT"
          echo "title=Nightly · ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: List collected files
        run: ls -la dist/ || true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.title }}
          body: |
            Build automatica del branch `${{ github.ref_name }}` al commit `${{ github.sha }}`.

            APK Android firmato con la keystore stabile del repo: installabile
            come update sopra le versioni precedenti senza disinstallare.

            Questo tag si aggiorna a ogni push del branch.
          draft: false
          prerelease: true
          make_latest: false
          files: dist/*
          fail_on_unmatched_files: false
