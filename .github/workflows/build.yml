name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Annulla build vecchie sullo stesso branch quando ne arriva una nuova
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------- #
  python-tests:
    name: Python tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-ita
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[]"
          pip install pytest
      - name: Run tests
        run: PYTHONPATH=src pytest -q tests/

  # ----------------------------------------------------------------------- #
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - os: macos-14
            triple: aarch64-apple-darwin
          - os: macos-13
            triple: x86_64-apple-darwin
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Tauri deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev \
            libayatana-appindicator3-dev libgtk-3-dev \
            pkg-config build-essential file

      - name: Build sidecar (PyInstaller)
        env:
          TARGET_TRIPLE: ${{ matrix.triple }}
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
          bash scripts/build_sidecar.sh

      - name: npm install (Tauri CLI)
        working-directory: desktop
        run: npm install

      - name: Build Tauri bundle
        working-directory: desktop
        run: npx tauri build

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp -v desktop/src-tauri/target/release/bundle/appimage/*.AppImage artifacts/ 2>/dev/null || true
            cp -v desktop/src-tauri/target/release/bundle/deb/*.deb artifacts/ 2>/dev/null || true
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp -v desktop/src-tauri/target/release/bundle/dmg/*.dmg artifacts/ 2>/dev/null || true
          else
            cp -v desktop/src-tauri/target/release/bundle/msi/*.msi artifacts/ 2>/dev/null || true
            cp -v desktop/src-tauri/target/release/bundle/nsis/*.exe artifacts/ 2>/dev/null || true
          fi
          ls -la artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: dewarp-desktop-${{ matrix.triple }}
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 14

  # ----------------------------------------------------------------------- #
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build release APK (unsigned)
        run: ./gradlew :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: dewarp-android-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14
